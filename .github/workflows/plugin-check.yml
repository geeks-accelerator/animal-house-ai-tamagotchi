# Keep the plugin bundle honest on every push and pull request:
# - the generated manifests in plugin/ match plugin/plugin.source.json
#   (and pin the MCP server version in mcp-server/package.json)
# - the plugin skills only name tools the MCP server has, with no em dashes
# - the MCP server's unit tests pass
name: Plugin and MCP server checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floors in mcp-server/package.json engines, so the stated
        # minimum is what CI runs. Raise these with the engines range.
        node: ['24.22.1', '26.12.1']
    name: check (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Plugin manifests are in sync
        run: node scripts/sync-plugin.mjs --check

      - name: MCP server tests
        working-directory: mcp-server
        run: |
          npm ci
          npm test
